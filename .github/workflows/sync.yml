name: Sync Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: Abs-Asif/abs-asif.github.io
          path: temp_source

      - name: Sync files from source repository
        run: |
          rsync -av --delete --exclude='.git' --exclude='.github/workflows/sync.yml' temp_source/ .
          rm -rf temp_source

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync content from Abs-Asif/abs-asif.github.io"
            git push
          fi
