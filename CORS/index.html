    function sortResults() {
      const resultsDiv = document.getElementById("results");
      const children = Array.from(resultsDiv.children);
      children.sort((a, b) => {
        const getOrder = (el) => {
          if (el.classList.contains("allowed")) return 0;
          if (el.classList.contains("testing")) return 1;
          if (el.classList.contains("blocked")) return 2;
          return 3;
        };
        return getOrder(a) - getOrder(b);
      });
      children.forEach((child) => resultsDiv.appendChild(child));
    }

    async function testCORS(source, index) {
      const resultEl = document.getElementById(`result-${index}`);
      if (!resultEl) return;
      resultEl.className = "result testing";
      resultEl.innerHTML = `<span class="status">${source.name}:</span> Testing...`;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      try {
        const response = await fetch(source.url, {
          method: "HEAD",
          mode: "cors",
          signal: controller.signal,
        });

        clearTimeout(timeoutId);
        resultEl.className = "result allowed";
        resultEl.innerHTML = `<span class="status">${source.name}:</span> ✓ CORS Allowed (${response.status})<div class="url">${source.url}</div>`;
      } catch (error) {
        clearTimeout(timeoutId);
        resultEl.className = "result blocked";
        resultEl.innerHTML = `<span class="status">${source.name}:</span> ✗ CORS Blocked<div class="url">${source.url}</div>`;
      } finally {
        sortResults();
      }
    }

    function testAllSources() {
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      newsSources.forEach((source, index) => {
        const div = document.createElement("div");
        div.id = `result-${index}`;
        div.className = "result";
        resultsDiv.appendChild(div);
        testCORS(source, index);
      });
    }

    function clearResults() {
      document.getElementById("results").innerHTML = "";
    }

    // Auto-test on page load
    window.addEventListener("load", testAllSources);
  </script>
